<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Promo mobile</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #0f0f23;
  }

  body {
    position: relative;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 42%),
      radial-gradient(circle at 85% 75%, rgba(130, 130, 255, 0.06) 0%, transparent 46%),
      repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.02) 0px, rgba(255, 255, 255, 0.02) 1px, transparent 1px, transparent 42px);
  }

  .pokeball {
    position: absolute;
    top: 50%;
    left: 6%;
    width: 560px;
    height: 560px;
    transform: translateY(-50%) rotate(-18deg);
    opacity: 0.88;
    filter: drop-shadow(0 30px 70px rgba(0, 0, 0, 0.55));
  }

  .phone {
    position: absolute;
    top: 50%;
    left: 58%;
    width: 447px;
    height: 1000px;
    padding: 50px 16px;
    box-sizing: border-box;
    border-radius: 60px;
    background: linear-gradient(160deg, #2a2a3a, #111118);
    box-shadow: 0 50px 120px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08), inset 0 0 0 2px rgba(255, 255, 255, 0.04);
    transform: translate(-50%, -50%) rotate(-5deg);
  }

  .phone-notch {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 22px;
    border-radius: 12px;
    background: #06060a;
  }

  .phone-home {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    height: 5px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.35);
  }

  .phone-screen {
    width: 100%;
    height: 900px;
    border-radius: 38px;
    overflow: hidden;
    background: #000;
  }

  .phone-screen img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }
</style>
</head>
<body>
  <img class="pokeball" src="/icons/favicon.svg" alt="" />
  <div class="phone">
    <div class="phone-notch"></div>
    <div class="phone-screen">
      <img id="shot" alt="" />
    </div>
    <div class="phone-home"></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const img = params.get('img');
    if (img) document.getElementById('shot').src = img;
  </script>
</body>
</html>
