<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — PokeUtils</title>
  <!-- No indexable: es la pagina que sale para una URL que no existe, no un
       contenido que deba salir en un buscador. "follow" para que un rastreador
       que llegue aqui por un enlace roto pueda seguir el de vuelta al inicio. -->
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#1a1a3e">
  <!-- Mismos iconos que index.html, para que la pestana no cambie de marca al
       caer aqui. Rutas absolutas por la misma razon que las fuentes de mas
       abajo: ver el comentario de ese bloque. -->
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <style>
    /* ===== FUENTES =====
       Los MISMOS dos ficheros que sirve style.css (subset latin, ya en el
       repo) -- no una copia nueva. No se enlaza style.css porque su nombre en
       produccion lleva un hash que cambia en cada build (scripts/build.mjs);
       esta pagina es un fichero suelto que Netlify sirve directo sin pasar por
       el build, asi que un enlace a "style.css" (el fuente sin build) se
       quedaria desactualizado en cuanto hubiera un segundo build, y uno al
       nombre hasheado de HOY se romperia en el primero. En vez de perseguir
       ese nombre, esta pagina lleva su propia hoja de estilos minima con los
       tokens que necesita copiados de :root/.light -- los mismos valores,
       mismo sitio de siempre si hace falta comprobarlos.
       Rutas absolutas ("/fonts/..."): Netlify sirve el CONTENIDO de este
       fichero para cualquier URL que no exista (p.ej. /foo/bar/baz), pero el
       navegador sigue creyendo que esta en esa URL falsa -- una ruta relativa
       ("fonts/...") resolveria contra ELLA, no contra la raiz, y la fuente no
       cargaria. Todo lo que este fichero referencia (iconos, fuentes, el
       action del formulario, el enlace de vuelta) es absoluto por esto mismo;
       scripts/build.mjs lo comprueba en cada build. */
    @font-face {
      font-family: 'Press Start 2P';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/press-start-2p-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
        U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
        U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'VT323';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/vt323-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
        U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
        U+2212, U+2215, U+FEFF, U+FFFD;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ===== TOKENS =====
       Copiados de style.css (:root / .light), solo los que esta pagina usa.
       Mismos valores, no una paleta nueva -- si algun dia cambian alli, hay
       que traerlos aqui a mano, pero al menos empiezan iguales. */
    :root {
      --bg: #0f0f23;
      --bg-surface: #1a1a3e;
      --accent: #ffcc00;
      --on-accent: #0f0f23;
      --accent-text: #ffcc00;
      --ink-1: #fcfcff;
      --ink-2: #bebedc;
      --ink-3: #8c8cb8;
      --border-accent: rgba(255, 204, 0, 0.3);
      --font-retro: 'Press Start 2P', monospace;
      --font-data: 'VT323', monospace;
      /* Igual que .light .scanlines en style.css: en oscuro la textura se ve
         entera, en claro se atenua. Una variable, no un selector compuesto
         del tipo ":root:not(.dark) .scanlines" -- ese selector atenuaria
         TAMBIEN el oscuro por defecto (sin .light ni .dark, ninguna clase),
         que tambien cumple ":not(.dark)". Con la variable, la textura sigue
         la MISMA cascada de arriba (:root / @media / .light / .dark) sin
         reinventar la logica de "quien gana" una segunda vez. */
      --scanline-opacity: 1;
    }
    /* El tema de la app se guarda en localStorage (pkutils_theme) con la
       misma clase .light que ya usa index.html -- este bloque cubre a quien
       lo trae elegido, sin importar lo que prefiera el sistema. Le gana al
       @media de mas abajo (aunque esta ANTES en el fichero) por especificidad:
       ":root.light" cuenta dos clases (0,2,0), el ":root" a secas de dentro
       del @media solo una (0,1,0) -- la eleccion explicita gana sin depender
       del orden. */
    :root.light {
      --bg: #eeeef5;
      --bg-surface: #ffffff;
      --accent: #b88800;
      --accent-text: #6f4f00;
      --ink-1: #181822;
      --ink-2: #3e3e6e;
      --ink-3: #62628c;
      --border-accent: rgba(184, 136, 0, 0.3);
      --scanline-opacity: 0.02;
    }
    /* Quien nunca eligio tema en la app (nada en localStorage) SI ve el que
       prefiera el sistema -- a diferencia de la app misma, que por defecto
       nace oscura pase lo que pase (ver initTheme en js/app.js). Esta pagina
       la puede visitar alguien que jamas paso por la app, asi que aqui si
       merece la pena mirar el sistema; si luego entra a la app y la deja en
       oscuro, .light no se pondra y esta regla tampoco, sin conflicto. */
    @media (prefers-color-scheme: light) {
      :root { --bg: #eeeef5; --bg-surface: #ffffff; --accent: #b88800;
        --accent-text: #6f4f00; --ink-1: #181822; --ink-2: #3e3e6e; --ink-3: #62628c;
        --border-accent: rgba(184, 136, 0, 0.3); --scanline-opacity: 0.02; }
    }
    /* Y quien SI eligio oscuro a mano (localStorage === 'dark') tiene que
       ganarle al media query de arriba si el sistema prefiere claro -- por
       eso este bloque repite los valores oscuros de :root con la misma
       especificidad que .light, para que gane por ser la eleccion explicita. */
    :root.dark {
      --bg: #0f0f23; --bg-surface: #1a1a3e; --accent: #ffcc00;
      --accent-text: #ffcc00; --ink-1: #fcfcff; --ink-2: #bebedc; --ink-3: #8c8cb8;
      --border-accent: rgba(255, 204, 0, 0.3); --scanline-opacity: 1;
    }

    html, body { min-height: 100%; }
    html { font-size: 18px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-data);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* La misma textura de fondo del resto del sitio -- "estetica de la casa"
       no es solo la tipografia, es tambien esto. No estaba en el artboard
       (que solo dibuja el contenido de la tarjeta), pero omitirla habria
       dejado esta pagina como la unica sin scanlines de todo PokeUtils. */
    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: var(--scanline-opacity);
      background: repeating-linear-gradient(0deg, transparent, transparent 2px,
        rgba(0, 0, 0, 0.06) 2px, rgba(0, 0, 0, 0.06) 4px);
    }

    /* El artboard aprobado enmarca cada idioma en una caja con borde solo
       para comparar ES y EN uno junto al otro dentro del propio lienzo -- es
       un recurso del lienzo, no parte de la pagina real (que solo muestra UN
       idioma a la vez, a pantalla completa). Lo que se reproduce aqui es lo
       de DENTRO de esa caja: el glitch, el titulo, la ayuda, el buscador y el
       boton, centrados sobre el fondo de la pagina -- sin tarjeta propia,
       igual que el resto de estados a pantalla completa del sitio
       (.no-results, el hero de la home) tampoco llevan una. */
    .err404 {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }

    /* ===== EL "404" CON GLITCH =====
       Misma estructura que el artboard: un span estatico (el "404" solido,
       en flujo normal, que es el que le da su tamano a la caja) y encima dos
       spans en position:absolute con el mismo texto, desplazados 3px y
       semitransparentes. Al ser positioned, los dos ultimos SIEMPRE pintan
       por encima del primero (asi lo dicta el orden de pintado de CSS para
       "position:static" vs "position:absolute" dentro del mismo contexto de
       apilamiento, pase lo que pase con el orden en el DOM) -- por eso el
       centro sale con un tono mezclado y solo el borde de 3px asoma el azul o
       el rosa puros. Ese mestizaje es el efecto, no un descuido: no lleva
       z-index porque anadir uno cambiaria justo lo que hay que reproducir.
       Los dos colores del glitch son valores fijos del espec, no tokens: no
       cambian con el tema -- igual que el resplandor dorado de .hl en
       style.css, que tampoco seria del tema. */
    .err404-glyph {
      position: relative;
      display: inline-block;
      font-family: var(--font-retro);
      font-size: 64px;
      line-height: 1;
      white-space: nowrap;
    }
    .err404-glyph span { display: block; }
    .err404-glyph .g-base {
      color: var(--accent-text);
      text-shadow: 0 0 18px rgba(255, 204, 0, 0.35);
    }
    .err404-glyph .g-blue,
    .err404-glyph .g-pink {
      position: absolute;
      top: 0;
      left: 0;
    }
    .err404-glyph .g-blue { top: 3px; left: 3px; color: rgba(96, 165, 250, 0.35); }
    .err404-glyph .g-pink { top: -2px; left: -3px; color: rgba(251, 113, 133, 0.3); }

    .err404-title {
      font-family: var(--font-retro);
      font-size: 11px;
      letter-spacing: 0.5px;
      color: var(--ink-1);
      line-height: 1.6;
    }

    .err404-help {
      font-family: var(--font-data);
      font-size: 21px;
      color: var(--ink-2);
      max-width: 420px;
      line-height: 1.35;
    }

    .err404-search {
      width: 100%;
      max-width: 380px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-surface);
      border: 2px solid var(--border-accent);
      border-radius: 8px;
      height: 44px;
      padding: 0 14px;
    }
    .err404-search svg { flex: none; }
    .err404-search input {
      flex: 1;
      min-width: 0;
      background: none;
      border: none;
      outline: none;
      color: var(--ink-2);
      font-family: var(--font-data);
      font-size: 20px;
    }
    .err404-search input::placeholder { color: var(--ink-3); }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .err404-home {
      font-family: var(--font-retro);
      font-size: 9px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--on-accent);
      background: var(--accent);
      border-radius: 8px;
      padding: 12px 20px;
    }
    .err404-home:hover { text-decoration: underline; }
  </style>
  <!-- Mismo patron de swap pre-pintado que index.html: sincrono, en el head,
       antes de que exista nada que pintar todavia -- asi el tema no parpadea
       entre "por defecto" y "el que tenia guardado". El de idioma, mas abajo,
       va al final del body en vez de aqui porque necesita el marcado ya
       parseado (ver ese bloque) -- el tema no, porque solo pone una clase en
       <html>, que ya existe en cuanto se ejecuta este script. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('pkutils_theme');
        if (saved === 'light') document.documentElement.classList.add('light');
        else if (saved === 'dark') document.documentElement.classList.add('dark');
        // Sin valor guardado: se queda como esta (nada de clase), y el
        // @media (prefers-color-scheme) del CSS de arriba decide.
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <main class="err404">
    <div class="err404-glyph" aria-hidden="true">
      <span class="g-base">404</span>
      <span class="g-blue">404</span>
      <span class="g-pink">404</span>
    </div>
    <h1 class="err404-title" id="err404Title">¡EL POKÉMON SALVAJE HUYÓ!</h1>
    <p class="err404-help" id="err404Help">Esta dirección no existe. Si buscabas un Pokémon, un movimiento o un objeto — algunos tienen nombres raros de verdad — prueba el buscador:</p>
    <!-- GET a la raiz con el texto en "q": la home, al arrancar con ?q= en la
         URL, abre el buscador global con ese texto ya escrito (ver
         js/home.js) y limpia el parametro con history.replaceState para que
         no se quede pegado. Sin boton de enviar visible -- como en el
         artboard -- pero con uno para lectores de pantalla y teclados sin
         Intro comodo (moviles con teclado numerico, por ejemplo). -->
    <form class="err404-search" action="/" method="GET">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="stroke:var(--ink-3)" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
      <input type="search" name="q" id="err404Input" autocomplete="off"
             placeholder="Busca un Pokémon, movimiento, objeto…"
             aria-label="Busca un Pokémon, movimiento, objeto…">
      <button type="submit" class="sr-only" id="err404Submit">Buscar</button>
    </form>
    <a class="err404-home" href="/" id="err404Home">Volver al inicio</a>
  </main>
  <!-- Traduccion adelantada, mismo patron que index.html (nav/hero): lee
       pkutils_lang y reescribe los textos EN antes del primer pintado, sin
       esperar a ningun modulo.
       EN_404.backHome es una copia de common.backhome (js/i18n-en.js):
       scripts/build.mjs la comprueba contra el diccionario real en cada
       build, igual que hace comprobarLiteralesEN con el nav y el hero de
       index.html -- si ese texto cambia alli sin acordarse de aqui, el build
       falla. El resto de EN_404 (titulo, ayuda, marcador del buscador) es
       texto propio de esta pagina: no existe en ningun diccionario de
       js/i18n-*.js para poder comprobarlo contra algo, asi que su unica
       fuente de verdad es este mismo bloque -- si se retoca alguna vez, hay
       que retocar los dos idiomas a mano, sin red de seguridad automatica. -->
  <script>
    (function () {
      try {
        if ((localStorage.getItem('pkutils_lang') || 'es') !== 'en') return;
        document.documentElement.lang = 'en';
        var EN_404 = {
          title: 'THE WILD POKÉMON FLED!',
          help: 'This address does not exist. If you were after a Pokémon, a move or an item — some have genuinely odd names — try the search:',
          searchPlaceholder: 'Search a Pokemon, move, item…',
          submit: 'Search',
          backHome: 'Back to home'
        };
        document.getElementById('err404Title').textContent = EN_404.title;
        document.getElementById('err404Help').textContent = EN_404.help;
        var input = document.getElementById('err404Input');
        input.placeholder = EN_404.searchPlaceholder;
        input.setAttribute('aria-label', EN_404.searchPlaceholder);
        document.getElementById('err404Submit').textContent = EN_404.submit;
        document.getElementById('err404Home').textContent = EN_404.backHome;
      } catch (e) {}
    })();
  </script>
</body>
</html>
