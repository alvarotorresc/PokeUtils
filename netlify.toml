# Cabeceras y el proxy de sprites. La configuracion de build y publish sigue en
# la interfaz de Netlify, y este fichero no debe pisarla.

# Generated datasets change once per Pokemon generation. Serve them stale
# while revalidating so navigation stays instant after the first visit.
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=604800"

# Los woff2 llevan el subset en el nombre y no cambian nunca: si algun dia hay
# otra version, sera otro fichero.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Los sprites venian de raw.githubusercontent.com con max-age=300, o sea cinco
# minutos: cada visita volvia a bajarse los treinta y dos de la portada desde un
# tercer origen. Pasan por aqui para que la pagina hable con un solo origen: el
# sprite del numero 25 lleva siendo el mismo desde 1996 y deberia cachearse como
# lo que es.
[[redirects]]
  from = "/sprites/*"
  to = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/:splat"
  status = 200
  force = true

[[headers]]
  for = "/sprites/*"
  [headers.values]
    # OJO: este bloque hoy no hace nada, y el comentario que habia decia lo
    # contrario. Netlify no aplica las cabeceras de este fichero a lo que sale de
    # un redirect 200 hacia un origen externo -- medido en produccion: /sprites/*
    # llega con las cabeceras de raw.githubusercontent.com, o sea con su
    # max-age=300, no con estas. Se queda escrito porque es exactamente lo que
    # haria falta el dia que los sprites se sirvan desde el propio sitio, que es
    # la decision pendiente; mientras tanto, cada visita sigue cruzando a GitHub.
    Netlify-CDN-Cache-Control = "public, max-age=2592000, stale-while-revalidate=31536000"
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
